<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Task Manager</title>
</head>

<body>

    <div class="todo-container">

        <h1 class="todo-title">Task Manager</h1>

        <div class="todo-input-section">
            <div class="enter-task">
                <input type="text" id="taskInput" class="todo-input" placeholder="Enter your task...">
            </div>
            <div class="enter-date">
                <input type="date" id="dateInput">
            </div>
            <div class="add-task-btn">
                <button id="addTaskBtn" class="todo-btn add-btn" onclick="addTask()">
                    Add Task
                </button>
            </div>
        </div>

        <ul id="taskList" class="todo-list"></ul>

        <button id="clearAllBtn" class="todo-btn clear-btn" onclick="clearAll()">
            Clear All
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
